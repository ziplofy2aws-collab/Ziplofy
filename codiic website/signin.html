<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codiic - Sign In</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/signin.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <main class="signin-page">
    <section class="signin-card">
      <h1>Get Started with Codiic</h1>
      <p class="signin-subtitle">Join our community of 45K+ Businesses</p>

      <form id="signinForm" novalidate>
        <label for="signinIdentity">Email or Phone</label>
        <input id="signinIdentity" name="signinIdentity" type="text" autocomplete="username" required>

        <button type="submit" class="signin-btn">Sign in</button>
      </form>

      <p class="signin-footer">Don't have an account? <a href="https://dashboard.codiic.com/login">Sign Up</a></p>
    </section>
  </main>

  <script src="assets/js/signin.js"></script>
</body>
</html>
