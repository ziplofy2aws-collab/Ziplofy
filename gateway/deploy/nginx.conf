# nginx site for the Codiic gateway (auth) SPA — auth.codiic.com / gateway.codiic.com
#
# Shipped inside gateway/dist/deploy/nginx.conf by the deploy workflow and
# installed to /etc/nginx/sites-available/codiic-gateway on the target EC2,
# then symlinked into sites-enabled. `nginx -t` runs before every reload.
#
# TLS: managed by certbot — this vhost listens on :80 and certbot adds the
# 443 server + redirect automatically (`certbot --nginx -d auth.codiic.com`).

server {
    listen 80;
    listen [::]:80;
    server_name auth.codiic.com gateway.codiic.com;

    root /var/www/codiic-gateway;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml font/woff2;

    # Auth API — proxied to gateway-server (pm2, port 3011) on the same host.
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite assets are immutable — cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point so new deploys go live instantly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
