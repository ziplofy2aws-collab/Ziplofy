# ── Theme editor live preview host ───────────────────────────────────────────
# Install on the *.crm-360.codiic.com edge (EC2 3.107.46.222) as
# /etc/nginx/sites-available/preview-crm-360 (symlink into sites-enabled),
# then `nginx -t && systemctl reload nginx`.
#
# WHY a dedicated block: `preview.crm-360.codiic.com` is currently caught by
# `server_name *.crm-360.codiic.com` and served as a merchant storefront.
# An exact server_name always beats a wildcard in nginx, so this block wins
# for preview traffic without touching tenant storefront routing.
#
# PREREQUISITE: copy the ssl_certificate / ssl_certificate_key lines from the
# existing *.crm-360.codiic.com block (same wildcard cert).

server {
  listen 443 ssl http2;
  server_name preview.crm-360.codiic.com;

  # TODO: copy from the existing *.crm-360.codiic.com server block
  # ssl_certificate     /etc/letsencrypt/live/crm-360.codiic.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/crm-360.codiic.com/privkey.pem;

  root /var/www/webpanel-store-renderer;
  index index.html;

  # Iframe security: let the CRM360 dashboard embed this host. CSP
  # frame-ancestors governs modern browsers; do NOT send X-Frame-Options.
  add_header Content-Security-Policy "frame-ancestors 'self' https://crm-360.codiic.com https://*.crm-360.codiic.com http://localhost:*" always;

  # API parity with tenant storefronts (same-origin /api). If the existing
  # wildcard block proxies /api elsewhere, use the SAME upstream here.
  location /api/ {
    proxy_pass https://crm-backend.codiic.com;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host crm-backend.codiic.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass https://crm-backend.codiic.com;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host crm-backend.codiic.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /theme-preview and everything else → SPA fallback (React mounts the
  # ThemePreviewApp from App.tsx on this path).
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Optional: redirect http → https so a stray plain-http hit still works.
server {
  listen 80;
  server_name preview.crm-360.codiic.com;
  return 301 https://preview.crm-360.codiic.com$request_uri;
}
