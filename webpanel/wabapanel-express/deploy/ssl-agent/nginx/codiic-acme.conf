# codiic-acme.conf — shared ACME HTTP-01 webroot location.
#
# ONE-TIME setup: add
#     include /etc/nginx/snippets/codiic-acme.conf;
# inside the EXISTING storefront :80 server block (the one that currently
# serves /var/www/webpanel-store-renderer for unmatched hostnames).
#
# ^~ makes this beat the SPA catch-all, so Lets Encrypt can always reach
# challenge files — even for hostnames whose cert was already issued
# (required for renewals).
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
}
