# Required GitHub Secrets:
#   codiic_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 13.126.166.12 (dashboard.codiic.com)
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /home/ubuntu/Ziplofy
#   VITE_GOOGLE_CLIENT_ID  - Optional; only if dashboard uses Google OAuth directly

name: Deploy codiic to EC2

on:
  push:
    branches: [main]
    paths:
      - 'codiic/**'
      - 'render-store/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codiic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            codiic/package-lock.json
            render-store/package-lock.json

      - name: Install codiic dependencies
        working-directory: codiic
        run: npm ci

      - name: Install render-store dependencies
        working-directory: render-store
        run: npm ci

      - name: Build codiic
        working-directory: codiic
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://backend.codiic.com/api
          VITE_SOCKET_URL: https://backend.codiic.com
          VITE_AUTH_MICROSERVICE_FRONTEND_URL: https://auth.codiic.com
          VITE_RENDER_STORE_ORIGIN: https://preview.codiic.com
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.codiic_EC2_SSH_KEY }}
          REMOTE_HOST: 13.126.166.12
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy
        with:
          source: 'codiic/'
          exclude: 'node_modules'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.126.166.12
          username: ubuntu
          key: ${{ secrets.codiic_EC2_SSH_KEY }}
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/Ziplofy
            npm ci
            pm2 delete all || true
            pm2 start npm -- run preview
