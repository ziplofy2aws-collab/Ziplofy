
name: Deploy Codiic Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'codiic/**'
      - 'render-store/**'
      - '.github/workflows/deploy-codiic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            codiic/package-lock.json
            render-store/package-lock.json

      - name: Install Codiic dependencies
        working-directory: codiic
        run: npm ci

      - name: Install Render Store dependencies
        working-directory: render-store
        run: npm ci

      - name: Build Codiic dashboard
        working-directory: codiic
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://backend.codiic.com/api
          VITE_SOCKET_URL: https://backend.codiic.com
          VITE_AUTH_MICROSERVICE_FRONTEND_URL: https://auth.codiic.com
          VITE_RENDER_STORE_ORIGIN: https://preview.codiic.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Verify and package build
        run: |
          set -e
          test -f codiic/dist/index.html
          cd codiic/dist
          zip -qr "$RUNNER_TEMP/codiic-dashboard.zip" .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload dashboard build to S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp "$RUNNER_TEMP/codiic-dashboard.zip" \
            "s3://codiic-dashboard-deploy-965754373653-ap-southeast-2/dashboard/${GITHUB_SHA}.zip"

      - name: Deploy through AWS Systems Manager
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          BUCKET="codiic-dashboard-deploy-965754373653-ap-southeast-2"
          KEY="dashboard/${GITHUB_SHA}.zip"
          INSTANCE_ID="i-02296fbd5dac02628"

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          BUCKET="$BUCKET"
          KEY="$KEY"
          WEB_ROOT="/var/www/codiic-dashboard"
          TEMP_DIR="/tmp/codiic-dashboard-deploy"

          command -v aws >/dev/null 2>&1 || {
            apt-get update
            apt-get install -y awscli
          }

          command -v unzip >/dev/null 2>&1 || {
            apt-get update
            apt-get install -y unzip
          }

          rm -rf "\$TEMP_DIR"
          mkdir -p "\$TEMP_DIR"

          aws s3 cp "s3://\$BUCKET/\$KEY" "\$TEMP_DIR/build.zip"

          unzip -q "\$TEMP_DIR/build.zip" -d "\$TEMP_DIR/build"

          test -f "\$TEMP_DIR/build/index.html"

          find "\$WEB_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "\$TEMP_DIR/build/." "\$WEB_ROOT/"

          chown -R ubuntu:www-data "\$WEB_ROOT"
          find "\$WEB_ROOT" -type d -exec chmod 755 {} +
          find "\$WEB_ROOT" -type f -exec chmod 644 {} +

          nginx -t
          systemctl reload nginx

          echo "Codiic dashboard deployed successfully."
          EOF
          )

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Codiic dashboard ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
