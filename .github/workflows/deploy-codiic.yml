# Deploy the codiic (main merchant dashboard) app to EC2
# Required GitHub Secrets:
#   codiic_EC2_SSH_KEY     - Private SSH key for EC2 (contents of .pem file)
#   codiic_EC2_HOST        - EC2 hostname or IP
#   codiic_EC2_USER        - SSH user (e.g. ubuntu, ec2-user)
# Deploy path (hardcoded): /home/ubuntu/merged-ziplofy
#   VITE_GOOGLE_CLIENT_ID  - Optional; only if dashboard uses Google OAuth directly

name: Deploy codiic to EC2

on:
  push:
    branches: [main]
    paths:
      - 'Ziplofy/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ziplofy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Ziplofy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build codiic
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://api.codiic.com/api
          VITE_SOCKET_URL: https://api.codiic.com
          VITE_AUTH_MICROSERVICE_FRONTEND_URL: https://auth.codiic.com
          VITE_RENDER_STORE_ORIGIN: https://preview.codiic.com
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.codiic_EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.codiic_EC2_HOST }}
          REMOTE_USER: ${{ secrets.codiic_EC2_USER }}
          TARGET: /home/ubuntu/merged-ziplofy
        with:
          source: 'Ziplofy/'
          exclude: 'node_modules'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.codiic_EC2_HOST }}
          username: ${{ secrets.codiic_EC2_USER }}
          key: ${{ secrets.codiic_EC2_SSH_KEY }}
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/merged-ziplofy
            npm ci
            pm2 delete all || true
            pm2 start npm -- run preview
