# Required GitHub Secrets:
#   FRONTEND_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 3.111.196.66 (admin.codiic.com)
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /home/ubuntu/Ziplofy

name: Deploy Admin to EC2

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to match EC2 runtime and avoid Node engine mismatch warnings
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        env:
          VITE_BACKEND_URL: https://backend.codiic.com/api
          VITE_SOCKET_URL: https://backend.codiic.com
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          REMOTE_HOST: 3.111.196.66
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy
        with:
          source: 'admin/'
          exclude: 'node_modules'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.111.196.66
          username: ubuntu
          key: ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          # Non-interactive SSH does not load .bashrc; source nvm/fnm so npm uses Node 24.
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/Ziplofy
            npm ci
            pm2 delete all || true
            pm2 start npm -- run preview
