# Required GitHub Secrets:
#   WABAPANEL_EXPRESS_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 52.74.78.80 (crm-backend.codiic.com)
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /var/www/wabapanel-express
# Public URL: https://crm-backend.codiic.com (port 5000 behind nginx)

name: Deploy wabapanel-express to EC2

on:
  push:
    branches: [main]
    paths:
      - 'webpanel/wabapanel-express/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webpanel/wabapanel-express

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webpanel/wabapanel-express/package-lock.json

      - name: Install dependencies (verify lockfile)
        run: npm ci

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WABAPANEL_EXPRESS_EC2_SSH_KEY }}
          REMOTE_HOST: 52.74.78.80
          REMOTE_USER: ubuntu
          TARGET: /var/www/wabapanel-express
        with:
          source: 'webpanel/wabapanel-express/'
          exclude: 'node_modules,uploads,wa_sessions,.env.development'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 52.74.78.80
          username: ubuntu
          key: ${{ secrets.WABAPANEL_EXPRESS_EC2_SSH_KEY }}
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /var/www/wabapanel-express
            npm ci --omit=dev
            export NODE_ENV=production
            if pm2 describe wabapanel-api >/dev/null 2>&1; then
              pm2 restart wabapanel-api --update-env
            else
              pm2 start src/server.js --name wabapanel-api --update-env
            fi
            pm2 save
