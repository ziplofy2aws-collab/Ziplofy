# Required GitHub Secrets:
#   RENDER_STORE_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 13.232.222.78 (preview.codiic.com)
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /home/ubuntu/Ziplofy
# API proxy target (hardcoded): https://backend.codiic.com

name: Deploy Render Store to EC2

on:
  push:
    branches: [main]
    paths:
      - 'render-store/**'
      # Bundled via @codiic/create-theme alias — rebuild storefront when runtimes change
      - 'codiic/src/create-theme/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to match EC2 runtime and avoid Node engine mismatch warnings
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            render-store/package-lock.json
            codiic/package-lock.json

      - name: Install codiic dependencies (create-theme peer types)
        working-directory: codiic
        run: npm ci

      - name: Install render-store dependencies
        working-directory: render-store
        run: npm ci

      - name: Build render-store
        working-directory: render-store
        env:
          VITE_PROXY_TARGET: https://backend.codiic.com
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RENDER_STORE_EC2_SSH_KEY }}
          REMOTE_HOST: 13.232.222.78
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy
        with:
          source: 'render-store/'
          exclude: 'node_modules'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.232.222.78
          username: ubuntu
          key: ${{ secrets.RENDER_STORE_EC2_SSH_KEY }}
          # Non-interactive SSH does not load .bashrc; source nvm/fnm so npm uses Node 24.
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/Ziplofy
            npm ci
            export VITE_PROXY_TARGET="https://backend.codiic.com"
            export codiic3B_API_UPSTREAM="https://backend.codiic.com"
            pm2 delete all || true
            pm2 start npm -- run preview
