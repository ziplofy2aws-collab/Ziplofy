# Deploys the gateway (auth frontend) SPA to the EC2 host serving
# auth.codiic.com / gateway.codiic.com.
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID        - deploy IAM user (same as codiic dashboard deploy)
#   AWS_SECRET_ACCESS_KEY    - deploy IAM user
#   AWS_REGION               - e.g. ap-southeast-2
#   VITE_GOOGLE_CLIENT_ID    - Google OAuth client id baked into the bundle
#
# Optional GitHub Variables:
#   GATEWAY_EC2_INSTANCE_ID  - target EC2 instance (defaults to the dashboard
#                              instance below — override if auth runs elsewhere)
#   GATEWAY_API_URL          - public URL of gateway-server (defaults to
#                              https://auth.codiic.com/api, proxied by nginx
#                              to gateway-server on 127.0.0.1:3011)
#
# Deploy path: /var/www/codiic-gateway (nginx vhost in gateway/deploy/nginx.conf,
# installed automatically to /etc/nginx/sites-available/codiic-gateway).

name: Deploy Gateway (Auth Frontend)

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATEWAY_INSTANCE_ID: ${{ vars.GATEWAY_EC2_INSTANCE_ID || 'i-02296fbd5dac02628' }}
  DEPLOY_BUCKET: codiic-dashboard-deploy-965754373653-ap-southeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install Gateway dependencies
        working-directory: gateway
        run: npm ci

      - name: Build Gateway frontend
        working-directory: gateway
        env:
          VITE_API_URL: ${{ vars.GATEWAY_API_URL || 'https://auth.codiic.com/api' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Verify and package build
        run: |
          set -e
          test -f gateway/dist/index.html
          mkdir -p gateway/dist/deploy
          cp gateway/deploy/nginx.conf gateway/dist/deploy/nginx.conf
          cd gateway/dist
          zip -qr "$RUNNER_TEMP/codiic-gateway.zip" .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload gateway build to S3
        run: |
          # Keep the key under dashboard/ — the deploy IAM user
          # (github-codiic-dashboard-deploy) is only allowed PutObject on that prefix.
          aws s3 cp "$RUNNER_TEMP/codiic-gateway.zip" \
            "s3://${DEPLOY_BUCKET}/dashboard/gateway/${GITHUB_SHA}.zip"

      - name: Deploy through AWS Systems Manager
        run: |
          set -euo pipefail

          BUCKET="${DEPLOY_BUCKET}"
          KEY="dashboard/gateway/${GITHUB_SHA}.zip"
          INSTANCE_ID="${GATEWAY_INSTANCE_ID}"

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          BUCKET="$BUCKET"
          KEY="$KEY"
          WEB_ROOT="/var/www/codiic-gateway"
          TEMP_DIR="/tmp/codiic-gateway-deploy"
          NGINX_SITE="codiic-gateway"

          command -v aws >/dev/null 2>&1 || {
            apt-get update
            apt-get install -y awscli
          }

          command -v unzip >/dev/null 2>&1 || {
            apt-get update
            apt-get install -y unzip
          }

          rm -rf "\$TEMP_DIR"
          mkdir -p "\$TEMP_DIR"

          aws s3 cp "s3://\$BUCKET/\$KEY" "\$TEMP_DIR/build.zip"

          unzip -q "\$TEMP_DIR/build.zip" -d "\$TEMP_DIR/build"

          test -f "\$TEMP_DIR/build/index.html"

          mkdir -p "\$WEB_ROOT"
          find "\$WEB_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "\$TEMP_DIR/build/." "\$WEB_ROOT/"

          # Install the versioned nginx vhost, then remove it from the web root.
          if [ -f "\$WEB_ROOT/deploy/nginx.conf" ]; then
            cp "\$WEB_ROOT/deploy/nginx.conf" "/etc/nginx/sites-available/\$NGINX_SITE"
            ln -sfn "/etc/nginx/sites-available/\$NGINX_SITE" "/etc/nginx/sites-enabled/\$NGINX_SITE"
          fi
          rm -rf "\$WEB_ROOT/deploy"

          chown -R ubuntu:www-data "\$WEB_ROOT"
          find "\$WEB_ROOT" -type d -exec chmod 755 {} +
          find "\$WEB_ROOT" -type f -exec chmod 644 {} +

          nginx -t
          systemctl reload nginx

          echo "Codiic gateway deployed successfully."
          EOF
          )

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Codiic gateway ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
