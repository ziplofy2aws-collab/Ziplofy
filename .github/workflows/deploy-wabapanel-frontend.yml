# Required GitHub Secrets:
#   WABAPANEL_FRONTEND_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 3.25.126.235 (crm-360.codiic.com)
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /home/ubuntu/Ziplofy/webpanel/wabapanel-frontend
# Public URL: https://crm-360.codiic.com (port 3002 behind nginx)
# PM2 process: crm360-frontend — this workflow only ever restarts that process.
#
# NOTE: Keep .env.production on the server (gitignored). remote-themes is synced
# alongside the app because next.config resolves ../../remote-themes from the
# app folder → /home/ubuntu/Ziplofy/remote-themes.
# Rollback: tar backups land in ~/backups/wabapanel-frontend-*.tgz on the server;
# restore with `tar -xzf <file> -C /home/ubuntu/Ziplofy/webpanel/wabapanel-frontend`
# then `npm run build && pm2 restart crm360-frontend`.

name: Deploy wabapanel-frontend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'webpanel/wabapanel-frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webpanel/wabapanel-frontend/package-lock.json

      - name: Install dependencies (verify lockfile)
        working-directory: webpanel/wabapanel-frontend
        run: npm ci

      - name: Backup current deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.25.126.235
          username: ubuntu
          key: ${{ secrets.WABAPANEL_FRONTEND_EC2_SSH_KEY }}
          script: |
            mkdir -p ~/backups
            tar -czf ~/backups/wabapanel-frontend-$(date +%Y%m%d-%H%M%S).tgz \
              -C /home/ubuntu/Ziplofy/webpanel/wabapanel-frontend \
              --exclude=node_modules --exclude=.next . \
              2>/dev/null || true

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WABAPANEL_FRONTEND_EC2_SSH_KEY }}
          REMOTE_HOST: 3.25.126.235
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy/webpanel/wabapanel-frontend
        with:
          source: 'webpanel/wabapanel-frontend/'
          exclude: 'node_modules,.next,.env*'

      - name: Deploy remote-themes (resolved via ../../remote-themes)
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WABAPANEL_FRONTEND_EC2_SSH_KEY }}
          REMOTE_HOST: 3.25.126.235
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy/remote-themes
        with:
          source: 'remote-themes/'

      - name: Install, build, and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.25.126.235
          username: ubuntu
          key: ${{ secrets.WABAPANEL_FRONTEND_EC2_SSH_KEY }}
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/Ziplofy/webpanel/wabapanel-frontend
            npm ci
            export NODE_ENV=production
            # Server .env.production wins; fall back to known production URLs.
            if [ -f .env.production ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env.production
              set +a
            fi
            export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://crm-360.codiic.com}"
            export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://crm-backend.codiic.com/api}"
            export NEXT_PUBLIC_SOCKET_URL="${NEXT_PUBLIC_SOCKET_URL:-https://crm-backend.codiic.com}"
            # Frontend and API are on DIFFERENT EC2s — never use 127.0.0.1 here.
            export INTERNAL_API_URL="${INTERNAL_API_URL:-https://crm-backend.codiic.com/api}"
            export NEXT_PUBLIC_STOREFRONT_PROTOCOL="${NEXT_PUBLIC_STOREFRONT_PROTOCOL:-https}"
            export NEXT_PUBLIC_STOREFRONT_HOST_SUFFIX="${NEXT_PUBLIC_STOREFRONT_HOST_SUFFIX:-.crm-360.codiic.com}"
            export NEXT_PUBLIC_GATEWAY_URL="${NEXT_PUBLIC_GATEWAY_URL:-https://gateway.codiic.com}"
            npm run build
            if pm2 describe crm360-frontend >/dev/null 2>&1; then
              pm2 restart crm360-frontend --update-env
            else
              pm2 start npm --name crm360-frontend -- start -- -p 3002
            fi
            pm2 save
