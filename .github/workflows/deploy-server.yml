# Required GitHub Secrets:
#   SERVER_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 13.233.4.35
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /home/ubuntu/Ziplofy

name: Deploy Server to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # defaults → Applies shared options for all steps.
    defaults:
      run:
      # working-directory: server → All run steps execute inside the server folder.
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to match EC2 (Vite 7 / Tailwind 4 need Node 20.19+; you use 24 on the server).
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_EC2_SSH_KEY }}
          REMOTE_HOST: 13.233.4.35
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy
        with:
          source: 'server/'
          exclude: 'node_modules'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.233.4.35
          username: ubuntu
          key: ${{ secrets.SERVER_EC2_SSH_KEY }}
          # Non-interactive SSH does not load .bashrc — nvm/fnm Node 24 is missing unless sourced.
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/Ziplofy
            npm ci
            pm2 delete all || true
            pm2 start npm -- run start
