name: Deploy Codiic Server

on:
  push:
    branches: [main]
    paths:
      - 'codiic-server/**'
      - '.github/workflows/deploy-codiic-server.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: codiic-server/package-lock.json

      - name: Install dependencies
        working-directory: codiic-server
        run: npm ci

      - name: Build Codiic Server
        working-directory: codiic-server
        run: npm run build

      - name: Deploy files to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CODIIC_SERVER_EC2_SSH_KEY_NEW }}
          REMOTE_HOST: 3.26.59.116
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy
        with:
          source: 'codiic-server/'
          exclude: '/node_modules/,.env.production'

      - name: Install production dependencies and restart Codiic Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.26.59.116
          username: ubuntu
          key: ${{ secrets.CODIIC_SERVER_EC2_SSH_KEY_NEW }}
          script: |
            set -e
            cd /home/ubuntu/Ziplofy/codiic-server

            if [ ! -f .env.production ]; then
              echo "ERROR: .env.production is missing. Deployment cannot start."
              exit 1
            fi

            npm ci --omit=dev

            NODE_ENV=production DOTENV_CONFIG_PATH=.env.production \
              pm2 startOrRestart build/index.js \
              --name codiic-server \
              --update-env

            pm2 save
