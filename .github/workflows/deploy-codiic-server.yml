# Required GitHub Secrets:
#   CODIIC_SERVER_EC2_SSH_KEY - Private SSH key for EC2 (contents of .pem file)
# EC2 host (hardcoded): 15.207.160.239 (backend.codiic.com)
# SSH user (hardcoded): ubuntu
# Deploy path (hardcoded): /home/ubuntu/Ziplofy

name: Deploy codiic3b to EC2

on:
  push:
    branches: [main]
    paths:
      - 'codiic-server/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codiic-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: codiic-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build codiic3b
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CODIIC_SERVER_EC2_SSH_KEY }}
          REMOTE_HOST: 15.207.160.239
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/Ziplofy
        with:
          source: 'codiic-server/'
          exclude: 'node_modules'

      - name: Install deps and restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 15.207.160.239
          username: ubuntu
          key: ${{ secrets.CODIIC_SERVER_EC2_SSH_KEY }}
          script: |
            set -e
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true
            echo "Using node: $(command -v node) ($(node -v))"
            cd /home/ubuntu/Ziplofy
            npm ci
            pm2 delete all || true
            pm2 start npm -- run start
