# Example nginx vhost for merchant storefronts (*.codiic.com).
# Replace codiic3B_API_UPSTREAM with your backend host (codiic3b EC2 / load balancer).
#
#   codiic3B_API_UPSTREAM examples:
#     http://10.0.1.42:5000
#     http://codiic3b.internal:5000
#     https://api.codiic.com

upstream codiic3b_api {
  server codiic3B_API_UPSTREAM;
}

server {
  listen 443 ssl http2;
  server_name ~^(?<storesubdomain>[a-z0-9-]+)\.codiic\.com$;

  root /home/ubuntu/merged-codiic-/render-store/dist;
  index index.html;

  # Theme editor iframe: allow framing of /theme-preview (CSP overrides X-Frame-Options).
  include /home/ubuntu/merged-codiic-/render-store/deploy/nginx-theme-preview-snippet.conf;

  # SEO: never serve SPA shell for sitemap/robots — proxy to backend runtime.
  location = /sitemap.xml {
    proxy_pass http://codiic3b_api/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /robots.txt {
    proxy_pass http://codiic3b_api/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://codiic3b_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://codiic3b_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
