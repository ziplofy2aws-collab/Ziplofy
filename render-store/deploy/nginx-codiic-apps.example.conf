# Nginx examples for codiic.com platform apps (not merchant storefronts).
# Merchant storefronts: see nginx-store-vhost.example.conf
# Theme preview CSP: see nginx-theme-preview-snippet.conf
#
# DNS records (all → appropriate EC2 / load balancer):
#   backend.codiic.com   → codiic3b backend
#   dashboard.codiic.com → Ziplofy merchant dashboard (dist or vite preview)
#   admin.codiic.com     → frontend super-admin app
#   auth.codiic.com      → client auth app
#   preview.codiic.com   → render-store (theme editor iframe only)
#   *.codiic.com         → render-store merchant storefronts

upstream codiic3b_api {
  server 127.0.0.1:5000;
}

# ── API (codiic3b) ─────────────────────────────────────────────────────++++++++++++
server {
  listen 443 ssl http2;
  server_name backend.codiic.com;

  location / {
    proxy_pass http://codiic3b_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ── Merchant dashboard (Ziplofy) ─────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name dashboard.codiic.com;

  root /home/ubuntu/merged-codiic-/Ziplofy/dist;
  index index.html;

  location /api/ {
    proxy_pass http://codiic3b_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://codiic3b_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ── Super-admin (frontend/) ────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name admin.codiic.com;

  root /home/ubuntu/merged-codiic-/frontend/dist;
  index index.html;

  location /api/ {
    proxy_pass http://codiic3b_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ── Auth microservice (client/) ────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name auth.codiic.com;

  root /home/ubuntu/merged-codiic-/client/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ── Theme preview iframe host (render-store) ───────────────────────────────────
server {
  listen 443 ssl http2;
  server_name preview.codiic.com;

  root /home/ubuntu/merged-codiic-/render-store/dist;
  index index.html;

  include /etc/nginx/snippets/codiic-theme-preview-headers.conf;

  location /api/ {
    proxy_pass http://codiic3b_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
