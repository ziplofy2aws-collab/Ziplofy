# Nginx snippet for render-store hosts (*.codiic.com store subdomains OR preview.codiic.com).
# Merchant store hosts often send X-Frame-Options: SAMEORIGIN, which blocks the admin theme editor iframe.
#
# Option A (recommended): DNS preview.codiic.com → render-store; dashboard loads preview.codiic.com/theme-preview
# Option B: On each store vhost, allow framing only for /theme-preview (below)

# --- Option A: dedicated preview host ---
# server {
#   server_name preview.codiic.com;
#   root /path/to/render-store/dist;
#   include /etc/nginx/snippets/codiic-theme-preview-headers.conf;
#   location / {
#     try_files $uri $uri/ /index.html;
#   }
# }

# --- Option B: allow framing on store subdomains for preview path only ---
# IMPORTANT: use a named location so headers survive try_files → /index.html fallback.
location = /theme-preview {
  include /etc/nginx/snippets/codiic-theme-preview-headers.conf;
  try_files /index.html =404;
}

location ^~ /theme-preview/ {
  include /etc/nginx/snippets/codiic-theme-preview-headers.conf;
  try_files /index.html =404;
}

location ^~ /remote-theme-runtime/ {
  include /etc/nginx/snippets/codiic-theme-preview-headers.conf;
  try_files $uri =404;
}
